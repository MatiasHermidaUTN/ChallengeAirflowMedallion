version: 2

models:
  - name: silver_typed_transactions
    description: Bronze tipado y normalizado, sin descartar filas.

  - name: quarantine_transactions
    description: Filas rechazadas con su motivo (TEST, monto nulo o negativo, sin id, fecha invalida).
    columns:
      - name: quarantine_reason
        tests:
          - not_null
          - accepted_values:
              values:
                - test_status
                - null_or_invalid_amount
                - negative_amount
                - missing_transaction_id
                - invalid_transaction_date

  - name: silver_transactions
    description: Transacciones validas, tipadas y sin duplicados por (transaction_id, transaction_date).
    columns:
      - name: transaction_id
        tests: [not_null]
      - name: transaction_date
        tests: [not_null]
      - name: amount
        tests: [not_null]
      - name: status
        tests:
          - accepted_values:
              values: ["COMPLETED", "PENDING", "CANCELLED"]
      - name: country_code
        tests: [not_null]
